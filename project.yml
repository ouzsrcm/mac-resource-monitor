name: MenuMonitor
options:
  bundleIdPrefix: tr.ouzsrcm
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
targets:
  MenuMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/*.entitlements"
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuMonitor
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ouzsrcm.MenuMonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 4C82989643
          CODE_SIGN_ENTITLEMENTS: Sources/App/MenuMonitor-Debug.entitlements
        Release:
          # Yerel Release derlemesi ad-hoc kalır. CI, Developer ID ve provisioning profile'ı
          # xcodebuild argümanlarıyla verir. CloudKit entitlement dosyası Production ortamıdır.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Sources/App/MenuMonitor-Release.entitlements
