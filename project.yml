name: MenuMonitor
options:
  bundleIdPrefix: tr.ouzsrcm
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
targets:
  MenuMonitor:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuMonitor
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ouzsrcm.MenuMonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
