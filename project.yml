name: MenuMonitor
options:
  bundleIdPrefix: tr.ouzsrcm
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
targets:
  MenuMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/*.entitlements"
          # iOS eşlik uygulaması bu hedefe girmez.
          - Companion/**
          - Companion/*
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuMonitor
        CFBundleLocalizations: [tr, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ouzsrcm.MenuMonitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 4C82989643
          CODE_SIGN_ENTITLEMENTS: Sources/App/MenuMonitor-Debug.entitlements
        Release:
          # Yerel Release derlemesi ad-hoc kalır. CI, Developer ID imzasını xcodebuild argümanlarıyla verir.
          # iCloud senkronu kapalı olduğu için Release entitlement taşımaz ve provisioning profile gerekmez.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
  # iPhone ve iPad eşlik uygulaması. Ayrı scheme; macOS release yalnızca MenuMonitor'ü derler.
  MenuMonitorCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Companion
        excludes:
          - "**/*.entitlements"
          - Info.plist
      - path: Sources/Shared
    info:
      path: Sources/Companion/Info.plist
      properties:
        CFBundleDisplayName: Pil Senkronu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - tr.ouzsrcm.MenuMonitor.companion.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.ouzsrcm.MenuMonitor.companion
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 4C82989643
        CODE_SIGN_ENTITLEMENTS: Sources/Companion/MenuMonitorCompanion.entitlements
schemes:
  MenuMonitor:
    build:
      targets:
        MenuMonitor: all
    run:
      config: Debug
    archive:
      config: Release
  MenuMonitorCompanion:
    build:
      targets:
        MenuMonitorCompanion: all
    run:
      config: Debug
    archive:
      config: Release
